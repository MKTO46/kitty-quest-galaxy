const k='trial_autopilot_v3'; const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let db;try{db=JSON.parse(localStorage.getItem(k))}catch(e){}db=Object.assign({weights:{},sets:[],runs:[],completed:{},rest:90,runLevel:0},db||{});let page='HOME',workout=null,runSession=null,clockTimer=null,seconds=90,runningTimer=false,timerEnds=0,restEnds=0, recapShownFor='';function save(){localStorage.setItem(k,JSON.stringify(db))}function notice(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastId);window.toastId=setTimeout(()=>el.style.display='none',1700)}function press(btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop')}function dayProfile(){return [{focus:'FIELD + MOBILITY',items:[]},{focus:'BACK',items:['Lat Pulldown','Low Row','Chest Press','Lateral Raise','Biceps Curl','Cable Crunch']},{focus:'CHEST',items:['Chest Press','Incline Press','Lat Pulldown','Lateral Raise','Triceps Pressdown','Dead Bug']},{focus:'ARMS',items:['Biceps Curl','Hammer Curl','Triceps Pressdown','Low Row','Chest Press','Cable Crunch']},{focus:'CORE',items:['Cable Crunch','Pallof Press','Dead Bug','Lat Pulldown','Lateral Raise','Chest Press']},{focus:'BACK + SHOULDERS',items:['Lat Pulldown','Low Row','Lateral Raise','Rear Delt Fly','Chest Press','Biceps Curl','Cable Crunch']},{focus:'UPPER BODY TECHNIQUE',items:['Assisted Pull-up','Chest Press','Low Row','Biceps Curl','Triceps Pressdown','Dead Bug']}][new Date().getDay()]}const defaults={'Lat Pulldown':{easy:55,master:70,challenge:80},'Low Row':{easy:40,master:55,challenge:65},'Chest Press':{easy:20,master:25,challenge:30},'Incline Press':{easy:15,master:20,challenge:25},'Lateral Raise':{easy:5,master:8,challenge:10},'Rear Delt Fly':{easy:5,master:8,challenge:10},'Biceps Curl':{easy:10,master:15,challenge:20},'Hammer Curl':{easy:10,master:15,challenge:20},'Triceps Pressdown':{easy:15,master:20,challenge:25},'Cable Crunch':{easy:15,master:20,challenge:25},'Pallof Press':{easy:10,master:12,challenge:15},'Dead Bug':{easy:0,master:0,challenge:0},'Assisted Pull-up':{easy:150,master:145,challenge:140}};function weight(ex,s){return (db.weights[ex]||defaults[ex]||{easy:0,master:0,challenge:0})[s]}function plan(){let p=dayProfile();if(!workout||workout.day!==today()){workout={day:today(),index:0,stage:0,round:1,extra:0,done:false,items:p.items}}return workout}let stages=['easy','master','challenge'];let targets=[12,10,8];function step(){let w=plan(),s=stages[w.stage];return {name:w.items[w.index],stage:s,target:targets[w.stage]+w.extra,weight:weight(w.items[w.index],s)}}function view(p){page=p;render()}function b(text,fn,extra=''){return `<button class="bubble tap btn ${extra}" onclick="press(this);${fn}">${text}</button>`}function card(body,cls=''){return `<div class="bubble ${cls}">${body}</div>`}function render(){let p=dayProfile(),out='',w=plan();if(page==='HOME'){out=`<div class="stack">${card(`<div class="eyebrow">TODAY · ${dayNames[new Date().getDay()].toUpperCase()}</div><div class="big">${p.focus}</div><div class="muted">No forms. Follow the next instruction.</div><p class="hint">Strength sets: ${db.sets.filter(x=>x.day===today()).length} · Running sessions: ${db.runs.filter(x=>x.day===today()).length}</p>`)}<div class="grid">${[['IRON','💪'],['RUNNING','🏃'],['RECOVERY','♡'],['PROGRESS','▥'],['CALENDAR','✧'],['TIMER','◷']].map(a=>`<button class="bubble tile tap btn" onclick="press(this);view('${a[0]}')"><span>${a[1]}</span>${a[0]}</button>`).join('')}</div>${card(`<div class="eyebrow">OCTOBER GOAL</div><div class="big">125 lb</div><div class="muted">Lat pulldown stretch target. Form first; current weight is adjusted in IRON.</div>`)}${b('✦ TODAY’S 10 PM RECAP',"view('RECAP')")}</div>`}

else if(page==='TIMER'){out=`<div class="stack">${card(`<div class="eyebrow">TIMER</div><div class="big" style="font-size:52px;text-align:center;margin:25px 0" id="timer-clock">${format(seconds)}</div><div class="actions">${[30,60,90,120].map(v=>b(`${v}s`,`seconds=${v};runningTimer=false;render()`)).join('')}</div><div class="actions">${b(runningTimer?'PAUSE':'START',"toggleTimer()",'primary')}${b('RESET',"runningTimer=false;seconds=90;render()")}${b('+ 30 SEC',"addTimer30()")}</div>`)}</div>`}document.getElementById('page').innerHTML=out;let nav=['HOME','IRON','RUNNING','RECOVERY','PROGRESS','CALENDAR','TIMER'];document.getElementById('nav').innerHTML=nav.map(n=>`<button class="bubble btn tap ${page===n?'current':''}" onclick="view('${n}')">${n}</button>`).join('')}
function formatDuration(n){n=Math.max(0,Math.round(n));return n>=3600?`${Math.floor(n/3600)}h ${Math.floor(n%3600/60)}m ${n%60}s`:`${Math.floor(n/60)}m ${n%60}s`}function format(n){n=Math.max(0,n|0);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function changeRep(n){let w=plan();w.extra=Math.max(-7,Math.min(20,w.extra+n));render()}function changeWeight(n){let x=step(),w=Object.assign({},db.weights[x.name]||defaults[x.name]||{easy:0,master:0,challenge:0});w[x.stage]=Math.max(0,(w[x.stage]||0)+n);db.weights[x.name]=w;save();render()}function logSet(){let x=step(),w=plan();db.sets.push({day:today(),exercise:x.name,stage:x.stage,weight:x.weight,reps:x.target,round:w.round});w.extra=0;w.stage++;if(w.stage===3){w.stage=0;w.round++}if(w.round>3){w.round=1;w.index++}if(w.index>=w.items.length){w.done=true;notice('STRENGTH COMPLETE ✨')}else{notice('SET SAVED · NEXT STEP!')}save();checkDay();view(w.done?'PROGRESS':'IRON')}function finishWorkout(){let w=plan();w.done=true;save();checkDay();notice('WORKOUT ENDED');view('PROGRESS')}function saveRun(){if(!runSession)return;db.runs.push({day:today(),name:runSession.choice.name,rounds:runSession.round,durationSeconds:Math.round((runSession.elapsed||0)+(runSession.startedAt?(Date.now()-runSession.startedAt)/1000:0))});runSession=null;db.runLevel=Math.min(2,db.runLevel+1);save();checkDay();notice('RUN / WALK SAVED ✨');view('PROGRESS')}function checkDay(){let strength=plan().done||new Date().getDay()===0;let moved=db.runs.some(r=>r.day===today());if(strength&&moved)db.completed[today()]=true;save()}function toggleRun(){let r=runSession;if(!r)return;if(r.end){r.elapsed=(r.elapsed||0)+(Date.now()-r.startedAt)/1000;r.startedAt=0;r.remaining=Math.max(1,Math.ceil((r.end-Date.now())/1000));r.end=0}else{r.startedAt=Date.now();r.end=Date.now()+(r.remaining||r.choice.segments[r.seg][1])*1000;r.remaining=0}render()}function moreRun(){if(!runSession)return;if(runSession.end)runSession.end+=30000;else runSession.remaining=(runSession.remaining||runSession.choice.segments[runSession.seg][1])+30;render()}function addTimer30(){if(runningTimer){timerEnds+=30000;}seconds+=30;render()}function toggleTimer(){if(runningTimer){seconds=Math.max(0,Math.ceil((timerEnds-Date.now())/1000));runningTimer=false}else{timerEnds=Date.now()+seconds*1000;runningTimer=true}render()}function tick(){const now=new Date(),date=today();if(now.getHours()>=22 && recapShownFor!==date && page!=='RECAP'){recapShownFor=date;view('RECAP')}document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(runningTimer){seconds=Math.max(0,Math.ceil((timerEnds-Date.now())/1000));if(!seconds){runningTimer=false;notice('TIMER COMPLETE')}}let t=document.getElementById('timer-clock');if(t)t.textContent=format(seconds);let r=runSession;if(r&&r.end){let remain=Math.max(0,Math.ceil((r.end-Date.now())/1000));if(!remain){r.elapsed=(r.elapsed||0)+(Date.now()-r.startedAt)/1000;r.startedAt=0;r.end=0;r.remaining=0;r.seg++;if(r.seg>=r.choice.segments.length){r.seg=0;r.round++}if(r.round>r.choice.rounds){notice('INTERVALS COMPLETE · SAVE RUN');r.round=r.choice.rounds;r.seg=1}else{notice('NEXT: '+r.choice.segments[r.seg][0].toUpperCase())}render()}else{let e=document.getElementById('run-clock');if(e)e.textContent=format(remain)}}let rc=document.getElementById('recovery-clock');if(rc&&restEnds){rc.textContent=format(Math.ceil((restEnds-Date.now())/1000));if(Date.now()>=restEnds){restEnds=0;rc.textContent='REST COMPLETE';notice('READY WHEN YOU ARE')}}}setInterval(tick,250);render();tick();
</script></body></html>
